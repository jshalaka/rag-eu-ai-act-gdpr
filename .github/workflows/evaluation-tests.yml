name: Evaluation tests

"on":
  push:
    branches: [main, master]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: evaluation-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

      # Keep model-download tests disabled in this workflow.
      RAG_RUN_SLOW: ""

      # Configure a local provider; test doubles handle model responses.
      RAG_LLM_PROVIDER: ollama
      RAG_RUN_STORE: sqlite

      # Prevent Hugging Face downloads during the test step.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install application and test dependencies
        # Install optional backends so their import paths are available.
        # Slow real-model tests remain gated by RAG_RUN_SLOW.
        run: python -m pip install -e ".[index,index-lite,llm,api,ui,cloud]" pytest pytest-cov

      - name: Check dependency consistency
        run: python -m pip check

      - name: Prepare reports directory
        run: python -c "from pathlib import Path; Path('ci-reports').mkdir(exist_ok=True)"

      - name: Record installed dependency versions
        run: python -m pip list --format=json > ci-reports/dependencies.json

      - name: Check Python syntax
        run: python -m compileall -q src tests scripts

      - name: Run tests
        run: >
          python -m pytest
          -q -rs --tb=short
          -W default
          -o filterwarnings=
          --junitxml=ci-reports/pytest.xml
          --cov-report=term-missing
          --cov-report=xml:ci-reports/coverage.xml

      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-tests-${{ matrix.os }}
          path: ci-reports/
          if-no-files-found: warn
          retention-days: 14