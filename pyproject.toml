[project]
name = "rag-eu-law"
version = "0.1.0"
description = "Cited RAG over the GDPR and the EU AI Act"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
index = ["chromadb>=0.5", "rank-bm25>=0.2.2", "sentence-transformers>=3.0"]
# Same retrieval stack without PyTorch (ONNX embeddings): small enough to deploy on a 1-2 GB host.
index-lite = ["chromadb>=0.5", "rank-bm25>=0.2.2", "fastembed>=0.4"]
llm = ["anthropic>=0.40", "httpx>=0.27", "openai>=1.50"]
api = ["fastapi>=0.111", "uvicorn>=0.30"]
ui = ["streamlit>=1.40"]
cloud = ["supabase>=2.9"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
]

[project.scripts]
rag-eu-law = "rag_eu_law.app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eu_law"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "PL", "RUF", "T20"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLR0913", "RUF001"]
"src/rag_eu_law/app/cli.py" = ["T20"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["chromadb.*", "rank_bm25.*", "sentence_transformers.*", "pymupdf.*", "fitz.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rag_eu_law.ingestion.loader", "tests.unit.test_loader", "tests.fixtures"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=rag_eu_law --cov-report=term-missing"

[tool.coverage.report]
fail_under = 0
